# GitOps: Argo CD sincroniza Keycloak desde Git (pull, no push; sin credenciales de cluster en el CI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<tu-usuario>/portafolio.git
    targetRevision: main
    path: k8s/keycloak/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
