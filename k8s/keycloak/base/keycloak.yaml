apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
automountServiceAccountToken: false
---
# Cluster headless para la descubierta JGroups (cache distribuido Infinispan)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: keycloak
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: jgroups
      port: 7800
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.5   # en prod: fijar por digest sha256
          args: ["start", "--optimized"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
            - { name: jgroups, containerPort: 7800 }
          env:
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HTTP_ENABLED, value: "true" }       # TLS termina en el ALB/Ingress
            - { name: KC_HOSTNAME_STRICT, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
            - { name: KC_CACHE, value: ispn }
            - { name: KC_CACHE_STACK, value: kubernetes }
            - { name: JAVA_OPTS_APPEND, value: "-Djgroups.dns.query=keycloak-headless.keycloak.svc.cluster.local" }
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              valueFrom: { secretKeyRef: { name: keycloak-db, key: url } }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-db, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health/ready, port: management, scheme: HTTPS }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management, scheme: HTTPS }
            initialDelaySeconds: 60
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /health/started, port: management, scheme: HTTPS }
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /opt/keycloak/data }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: keycloak
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keycloak
  namespace: keycloak
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: keycloak }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# Default deny + reglas minimas (PCI DSS Req. 1: segmentacion de red)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }   # namespace del ingress controller / LB controller
      ports: [{ port: 8080 }]
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports: [{ port: 7800 }]
  egress:
    - to:    # DNS
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:    # Pods Keycloak (JGroups)
        - podSelector:
            matchLabels: { app.kubernetes.io/name: keycloak }
      ports: [{ port: 7800 }]
    - to:    # Base de datos (RDS) en subnets privadas
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /realms/master
spec:
  ingressClassName: alb
  rules:
    - host: sso.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: keycloak, port: { name: http } } }
