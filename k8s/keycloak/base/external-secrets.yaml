# Los secretos NUNCA viven en Git: se sincronizan desde AWS Secrets Manager
# con External Secrets Operator (acceso via IRSA / Pod Identity).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: keycloak
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets-reader }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: keycloak-db }
  data:
    - { secretKey: url, remoteRef: { key: portafolio/keycloak/db, property: url } }
    - { secretKey: username, remoteRef: { key: portafolio/keycloak/db, property: username } }
    - { secretKey: password, remoteRef: { key: portafolio/keycloak/db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: keycloak-admin }
  data:
    - { secretKey: username, remoteRef: { key: portafolio/keycloak/admin, property: username } }
    - { secretKey: password, remoteRef: { key: portafolio/keycloak/admin, property: password } }
