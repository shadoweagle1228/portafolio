AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bucket S3 seguro alineado a PCI DSS v4.0 (Req. 1, 3, 4, 7, 10).
  Incluye KMS CMK con rotacion, bucket de logs inmutable (Object Lock),
  TLS obligatorio, versionado y bloqueo de acceso publico.

Parameters:
  BucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{2,62}$"
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
  DataClassification:
    Type: String
    Default: cardholder-data
    AllowedValues: [public, internal, confidential, cardholder-data]
  Owner:
    Type: String
  LogRetentionDays:
    Type: Number
    Default: 365          # PCI DSS 10.5.1: 12 meses de retencion
    MinValue: 365

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "CMK para ${BucketName}"
      EnableKeyRotation: true            # PCI DSS 3.7.4 rotacion de llaves
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AdminAccountRoot
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
      Tags: &tags
        - { Key: Environment, Value: !Ref Environment }
        - { Key: DataClassification, Value: !Ref DataClassification }
        - { Key: Owner, Value: !Ref Owner }
        - { Key: Compliance, Value: pci-dss-v4 }

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${BucketName}"
      TargetKeyId: !Ref DataKey

  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${BucketName}-logs"
      ObjectLockEnabled: true             # PCI DSS 10.3.2 / 10.3.4 integridad de logs
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention: { Mode: COMPLIANCE, Days: !Ref LogRetentionDays }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration: &pab
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: archive-after-90-days     # 3 meses disponibles inmediatamente
            Status: Enabled
            Transitions: [{ StorageClass: GLACIER, TransitionInDays: 90 }]
      Tags: *tags

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal: { Service: logging.s3.amazonaws.com }
            Action: "s3:PutObject"
            Resource: !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref "AWS::AccountId" }

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration: *pab       # Req. 1 / 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn   # Req. 3.5
      VersioningConfiguration: { Status: Enabled }
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: !Sub "${BucketName}/"
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags: *tags

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport             # Req. 4.2.1 TLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: DenyOldTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { NumericLessThan: { "s3:TlsVersion": 1.2 } }
          - Sid: DenyUnencryptedUploads
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            Resource: !Sub "${DataBucket.Arn}/*"
            Condition:
              StringNotEqualsIfExists: { "s3:x-amz-server-side-encryption": "aws:kms" }

Outputs:
  BucketArn: { Value: !GetAtt DataBucket.Arn }
  KmsKeyArn: { Value: !GetAtt DataKey.Arn }
  LogsBucketName: { Value: !Ref AccessLogsBucket }
