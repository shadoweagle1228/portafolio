[project]
name = "bucket-auditor"
version = "0.1.0"
description = "Auditor de buckets S3 contra PCI DSS v4.0 (arquitectura hexagonal)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "boto3", "botocore.*", "botocore"]
ignore_missing_imports = true
